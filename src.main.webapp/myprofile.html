<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - wintask.in</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', 'Segoe UI', sans-serif; }
        body { 
            background: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.95)),
                    url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 255, 204, 0.2);
            animation: floatUp 10s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
        .dashboard-card { 
            position: relative;
            z-index: 10;
            background: rgba(18, 18, 32, 0.9); 
            border: 2px solid #00ffcc; 
            border-radius: 24px; 
            padding: 40px; 
            max-width: 600px; 
            width: 100%; 
            box-shadow: 0 0 40px rgba(0,255,204,0.4), inset 0 0 25px rgba(0,255,204,0.12); 
            backdrop-filter: blur(16px);
            animation: cardGlow 6s infinite alternate;
        }
        @keyframes cardGlow {
            0% { border-color: rgba(0, 255, 204, 0.5); box-shadow: 0 0 25px rgba(0, 255, 204, 0.25), inset 0 0 15px rgba(0,255,204,0.1); }
            50% { border-color: rgba(255, 0, 127, 0.7); box-shadow: 0 0 40px rgba(255, 0, 127, 0.4), inset 0 0 25px rgba(255,0,127,0.15); }
            100% { border-color: rgba(0, 153, 255, 0.7); box-shadow: 0 0 35px rgba(0, 153, 255, 0.4), inset 0 0 20px rgba(0,153,255,0.15); }
        }
        .profile-header-flex {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }
        .avatar-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffcc, #ff007f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            border: 2px solid #fff;
            flex-shrink: 0;
        }
        .profile-title-area h1 { 
            color: #00ffcc; 
            font-size: 28px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0,255,204,0.6);
            text-align: left;
            margin-bottom: 5px;
        }
        .profile-title-area p {
            color: #a0a5b0;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .info-box { 
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0, 255, 204, 0.02)); 
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 18px 22px; 
            border-radius: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 16px; 
            transition: all 0.3s ease;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .info-box::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }
        .info-box:nth-child(2)::before {
            background: #ff007f;
            box-shadow: 0 0 10px #ff007f;
        }
        .info-box:nth-child(3)::before {
            background: #0099ff;
            box-shadow: 0 0 10px #0099ff;
        }
        .info-box:hover {
            border-color: rgba(0, 255, 204, 0.9);
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.1), rgba(255,255,255,0.08));
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.25), inset 0 0 15px rgba(0,255,204,0.15);
        }
        .info-box .label-text {
            color: #b8c1ec;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
            font-weight: 700;
        }
        .info-box span { 
            color: #00ffcc; 
            font-weight: 900; 
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0,255,204,0.6); 
        }
        .info-box:nth-child(2) span {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255,0,127,0.6);
        }
        .info-box:nth-child(3) span {
            color: #0099ff;
            text-shadow: 0 0 10px rgba(0,153,255,0.6);
        }
        h3 { 
            color: #ff007f; 
            margin-top: 25px; 
            margin-bottom: 10px; 
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,0,127,0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        ul { 
            list-style: none; 
            max-height: 160px; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; 
            border-radius: 14px; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }
        ul::-webkit-scrollbar {
            width: 6px;
        }
        ul::-webkit-scrollbar-thumb {
            background: #ff007f;
            border-radius: 10px;
            box-shadow: 0 0 8px #ff007f;
        }
        ul li { 
            padding: 10px 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
            font-size: 14px; 
            color: #d0d5e0; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        ul li:before {
            content: "⚡";
            color: #00ffcc;
            font-size: 12px;
            text-shadow: 0 0 8px #00ffcc;
        }
        ul li:last-child { border-bottom: none; }
        .logout-btn {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: linear-gradient(45deg, #ff007f, #ff4d4d);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }
        .logout-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.9);
            background: linear-gradient(45deg, #ff1a8c, #ff6666);
        }
        .home-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 15px;
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border: 2px solid #00ffcc;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.25);
        }
        .home-btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 30px #00ffcc;
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle" style="width: 12px; height: 12px; left: 15%; animation-duration: 8s;"></div>
        <div class="particle" style="width: 18px; height: 18px; left: 75%; animation-duration: 10s;"></div>
        <div class="particle" style="width: 8px; height: 8px; left: 45%; animation-duration: 6s;"></div>
    </div>
    <div class="dashboard-card">
        <div class="profile-header-flex">
            <div class="avatar-circle">🎮</div>
            <div class="profile-title-area">
                <h1>My Profile</h1>
                <p>wintask.in Member Dashboard</p>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="info-box">
                <span class="label-text">👤 Username</span>
                <span id="username">Loading...</span>
            </div>
            <div class="info-box">
                <span class="label-text">⭐ Score</span>
                <span id="score">0</span>
            </div>
            <div class="info-box">
                <span class="label-text">💰 Wallet Balance</span>
                <span id="wallet">0</span>
            </div>
        </div>
        
        <h3>🏆 Claim History</h3>
        <ul id="historyList">
            <li>No history found.</li>
        </ul>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
        <a href="index.html" class="home-btn">← Back to Home</a>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem("userName") || localStorage.getItem("userEmail") || "User";
            document.getElementById("username").innerText = savedName;
            
            // Load saved score from localStorage supporting all variant keys (including wintask_score used in story pages)
            const savedScore = localStorage.getItem("userScore") || localStorage.getItem("wintask_score") || localStorage.getItem("user_profile_score") || "0";
            document.getElementById("score").innerText = savedScore;
            
            // Load wallet balance if stored separately
            const savedWallet = localStorage.getItem("userWallet") || "0";
            document.getElementById("wallet").innerText = savedWallet;
            // Load and display claim history supporting both string and object formats from love1/summary pages (including wintask_history)
            const historyList = document.getElementById("historyList");
            const claimHistory = JSON.parse(localStorage.getItem("claimHistory")) || JSON.parse(localStorage.getItem("wintask_history")) || [];
            
            if (claimHistory.length > 0) {
                historyList.innerHTML = "";
                claimHistory.forEach(item => {
                    const li = document.createElement("li");
                    if (typeof item === 'object' && item !== null) {
                        li.textContent = `${item.title || 'Reward'} +${item.points || ''} pts - ${item.date || item.time || ''}`;
                    } else {
                        li.textContent = item;
                    }
                    historyList.appendChild(li);
                });
            } else {
                historyList.innerHTML = `<li>No history found.</li>`;
            }
        });
        function logoutUser() {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("userName");
            localStorage.removeItem("userEmail");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
