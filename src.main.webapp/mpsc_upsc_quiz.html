let mcqIndex = 0; 

function loadMcq() { 
    if (mcqIndex < massiveMcqQuestions.length) {
        const data = massiveMcqQuestions[mcqIndex]; 
        document.getElementById("progressText").innerText = `प्रश्न ${mcqIndex + 1} / ${massiveMcqQuestions.length}`;
        document.getElementById("mcqQuestion").innerText = data.q; 
        
        const container = document.getElementById("mcqOptions"); 
        container.innerHTML = ""; 
        document.getElementById("mcqNextBtn").style.display = "none"; 
        
        data.options.forEach((opt, idx) => { 
            const btn = document.createElement("button"); 
            btn.className = "option-btn"; 
            btn.innerText = (idx + 1) + ". " + opt; 
            btn.onclick = () => selectMcq(idx, data.correct, btn); 
            container.appendChild(btn); 
        }); 
    } else { 
        document.getElementById("quizBox").innerHTML = `<h2 style="color:#00ffcc; text-align:center;">अभिनंदन! तुम्ही सर्व १०० प्रश्न पूर्ण केले आहेत! 🎉</h2>`; 
        document.getElementById("progressText").style.display = "none";
    }
} 

function selectMcq(idx, correct, btn) { 
    document.querySelectorAll(".option-btn").forEach(b => b.disabled = true); 
    if (idx === correct) { 
        btn.style.background = "#00ffcc"; 
        btn.style.color = "#000"; 
    } else { 
        btn.style.background = "#ff007f"; 
        document.querySelectorAll(".option-btn")[correct].style.background = "#00ffcc";
        document.querySelectorAll(".option-btn")[correct].style.color = "#000";
    } 
    document.getElementById("mcqNextBtn").style.display = "inline-block"; 
} 

function nextMcq() { 
    mcqIndex++; 
    loadMcq(); 
} 

window.onload = () => { 
    loadMcq(); 
}; 
</script>
