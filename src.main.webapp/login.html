<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - wintask.in</title>
    <!-- गुगलची अधिकृत स्क्रिप्ट इथे ॲड केली आहे -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background:
                linear-gradient(rgba(11,12,16,0.88), rgba(11,12,16,0.96)),
                url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .login-box {
            width: 90%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(18,18,32,0.90);
            border: 2px solid #00ffcc;
            border-radius: 25px;
            box-shadow:
                0 0 35px rgba(0,255,204,0.35),
                inset 0 0 20px rgba(0,255,204,0.08);
            backdrop-filter: blur(12px);
        }
        .logo {
            font-size: 32px;
            font-weight: 900;
            color: #00ffcc;
            margin-bottom: 10px;
            text-shadow:
                0 0 15px #00ffcc,
                0 0 25px #00ffcc;
        }
        .login-box h2 {
            margin-bottom: 10px;
            font-size: 26px;
        }
        .login-box p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
        }
        /* गुगल साईन-इन बटण दिसायला सुंदर करण्यासाठी */
        .g_id_signin {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .back-btn {
            display: inline-block;
            margin-top: 22px;
            color: #00ffcc;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover {
            color: #ff007f;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🎮 wintask.in</div>
        <h2>Welcome Back</h2>
        <p>Login to continue playing and earning scores.</p>
        
        <!-- Google Sign-In Setup with Callback Function -->
        <div id="g_id_onload"
             data-client_id="411157908550-oabikfkditdoikrvujpu8iqo8bvb4tp7.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        
        <div class="g_id_signin" 
             data-type="standard" 
             data-size="large" 
             data-theme="outline" 
             data-text="sign_in_with" 
             data-shape="rectangular" 
             data-logo_alignment="left">
        </div>
        
        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>
    </div>
    <script>
        // JWT टोकन डीकोड करून युजरचे नाव मिळवण्याचे फंक्शन
        function parseJwt(token) {
            try {
                var base64Url = token.split('.')[1];
                var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }
        // युजरने यशस्वीपणे लॉग इन केल्यावर हे फंक्शन कॉल होईल आणि डॅशबोर्डवर पाठवेल
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            
            // गुगल टोकन डीकोड करून युजरची माहिती मिळवणे
            const responsePayload = parseJwt(response.credential);
            
            if (responsePayload && responsePayload.name) {
                // युजरचे नाव थेट 'userName' key ने सेव्ह करणे
                localStorage.setItem("userName", responsePayload.name);
                localStorage.setItem("userEmail", responsePayload.email);
            } else {
                localStorage.setItem("userName", "Google User");
            }
            
            localStorage.setItem("isLoggedIn", "true");
            
            // थेट dashboard.html वर रीडायरेक्ट करा
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
