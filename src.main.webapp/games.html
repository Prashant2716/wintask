<script> 
let totalCoins = parseInt(localStorage.getItem('wintask_coins') || 0); 
 
function updateScore(points) { 
    totalCoins += points; 
    localStorage.setItem('wintask_coins', totalCoins);
    document.getElementById("totalScore").innerText = totalCoins; 
} 
 
let gameTimeInSeconds = 0;
function startGameTimer() {
    setInterval(() => {
        gameTimeInSeconds++;
        if (gameTimeInSeconds === 300) {
            updateScore(25); 
            alert("अभिनंदन! तुम्ही ५ मिनिटे खेळलात आणि तुम्हाला २५ कॉइन्स मिळाले! 🎉");
            gameTimeInSeconds = 0;
        }
    }, 1000);
}
