<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - wintask.in</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.95)),
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
        }
        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #00ffcc;
            text-transform: lowercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #00ffcc;
            text-decoration: none;
        }
        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .nav-links a {
            text-decoration: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            color: #ff007f;
        }
        .contact-container {
            max-width: 900px;
            margin: 50px auto;
            background: rgba(15, 17, 26, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            width: 90%;
        }
        .contact-container h1 {
            color: #00ffcc;
            font-size: 32px;
            margin-bottom: 20px;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(0, 255, 204, 0.2);
            padding-bottom: 10px;
        }
        .contact-container p {
            color: #c0c5d0;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #00ffcc;
            font-weight: 600;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 204, 0.2);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            outline: none;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
        .form-group textarea {
            resize: vertical;
            height: 140px;
        }
        .submit-btn {
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .submit-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px #00ffcc;
        }
        .back-home {
            display: inline-block;
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-home:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 15px #00ffcc;
        }
        .footer {
            background: rgba(7, 8, 12, 0.75);
            border-top: 1px solid rgba(0, 255, 204, 0.2);
            padding: 20px;
            text-align: center;
            color: #888;
            margin-top: auto;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🎮 wintask.in</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="games.html">Games</a></li>
        </ul>
    </header>

    <div class="contact-container">
        <h1>Contact Us</h1>
        <p>Have questions, feedback, or facing any technical issues with wintask.in? Fill out the form below and our support team will get back to you as soon as possible.</p>
        
        <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent successfully.');">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email address" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <footer class="footer">
        © 2026 wintask.in. All rights reserved.
    </footer>

</body>
</html>
